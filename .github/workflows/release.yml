name: Release

# Runs only when a GitHub Release is published, which is a deliberate manual
# action. Nothing is uploaded on an ordinary push or tag.
#
# Uses PyPI Trusted Publishing, so no API token is stored here. Before the
# first run, add a trusted publisher on PyPI for this repository and workflow
# (project settings -> Publishing), and create a `pypi` environment in the
# repository settings if you want an approval gate.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Verify the release commit passes checks
        run: |
          uv run ruff check src/ tests/
          uv run mypy src/ tests/
          uv run pytest tests/ -q --cov-fail-under=90

      - name: Build
        run: uv build

      - name: Check metadata
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
