name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --all-extras installs cypd and hvcc. Without them the integration tests
      # silently skip, which is how the hvcc and libpd code paths went
      # unexercised despite a green build.
      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      # Mirrors `make typecheck`: strict on the library, ordinary on tests.
      - name: Type check
        run: |
          uv run mypy --strict src/
          uv run mypy tests/

      - name: Test
        run: uv run pytest tests/ -v --cov-fail-under=90

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
